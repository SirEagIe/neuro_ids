<head>
    <link rel="stylesheet" href="https://cdn.datatables.net/2.1.8/css/dataTables.dataTables.css" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="https://cdn.datatables.net/2.1.8/js/dataTables.js"></script>
</head>
<body>
    <nav class="navbar navbar-expand-sm navbar-light bg-primary">
        <div class="container-fluid">
            <a class="navbar-brand fs-3 ms-3" href="/" style='color: aliceblue;'>Neural IDS</a>
            <div class="collapse navbar-collapse" id="navbarID">
                <div class="navbar-nav">
                    <a class="nav-link active fs-5" aria-current="page" style='color: aliceblue;' href="/dashboard">Дашборд</a>
                    <a class="nav-link active fs-5" aria-current="page" style='color: aliceblue;' href="/incidents">Инциденты</a>
                </div>
            </div>
        </div>
    </nav>
    <div class="container">
        <div class="row mt-5" id="incidents"></div>
    </div>

    <script>
        fetch('/incidents-data')
            .then((response) => response.json())
            .then((response) => response.data)
            .then((response) => {
                html_ = ''
                response.forEach(el => {
                    html_ += '<div class="col-xl-3 col-lg-3 col-md-4 col-sm-6 col-12 text-center">'
                    html_ += '<div class="m-3">'
                    html_ += '<ul class="list-group">'
                    html_ += '<li class="list-group-item active" aria-current="true">Инцидент №' + el[0] + '</li>'
                    html_ += '<li class="list-group-item">Тип: ' + el[4] + '</li>'
                    html_ += '<li class="list-group-item">Источник: ' + el[1] + '</li>'
                    html_ += '<li class="list-group-item">Цель: ' + el[2] + '</li>'
                    html_ += '<li class="list-group-item">Время: ' + el[3] + '</li>'
                    html_ += '</ul>'
                    html_ += '</div>'
                    html_ += '</div>'
                });
                document.getElementById('incidents').innerHTML = html_;
            })
    </script>
</body>
